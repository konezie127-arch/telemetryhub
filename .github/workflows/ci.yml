name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read          # principe du moindre privilège

concurrency:              # annule les exécutions obsolètes sur la même branche
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: test           # ne s'exécute que si les tests passent
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image (sans publication)
        run: docker build -f docker/Dockerfile -t telemetryhub:ci .

      - name: Test de fumée du conteneur
        run: |
          docker run -d --name smoke -p 8000:8000 telemetryhub:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && break || sleep 2
          done
          curl -fs http://localhost:8000/health
          docker rm -f smoke
