name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: "Tag d'image (SHA court) à déployer"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag d'image (SHA court) à déployer ou restaurer (rollback manuel)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write          # nécessaire pour l'authentification OIDC

concurrency:
  group: deploy-production
  cancel-in-progress: false  # un déploiement en cours n'est jamais interrompu

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: eu-north-1
      TAG: ${{ inputs.tag }}
    steps:
      - name: Valider le tag
        run: |
          if ! [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Tag invalide : $TAG" >&2
            exit 1
          fi

      - name: Authentification AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Localiser l'instance
        run: |
          read -r INSTANCE_ID PUBLIC_IP < <(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=telemetryhub-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].[InstanceId,PublicIpAddress]" --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"
          echo "PUBLIC_IP=$PUBLIC_IP" >> "$GITHUB_ENV"

      - name: Déployer via SSM (rollback automatique si échec)
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG (run ${{ github.run_id }})" \
            --parameters "commands=[\"/opt/telemetryhub/deploy.sh $TAG\"]" \
            --query "Command.CommandId" --output text)
          echo "Commande SSM : $CMD_ID"

          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 5
          done

          echo "----- sortie standard -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- sortie d'erreur -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "Statut final : $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Vérification externe (depuis Internet)
        run: |
          for i in $(seq 1 10); do
            SHA=$(curl -fsS --max-time 5 "http://$PUBLIC_IP/version" 2>/dev/null \
              | grep -o '"git_sha":"[^"]*"' | cut -d'"' -f4 || true)
            echo "Tentative $i : version en ligne = ${SHA:-indisponible}"
            [ "$SHA" = "$TAG" ] && exit 0
            sleep 3
          done
          echo "La version attendue n'est pas en ligne" >&2
          exit 1

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Déploiement"
            echo "- Tag demandé : \`$TAG\`"
            echo "- Instance : \`${INSTANCE_ID:-inconnue}\`"
            echo "- Résultat : ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
