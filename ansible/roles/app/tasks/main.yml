- name: Vérifier qu'un tag d'image immuable est fourni
  ansible.builtin.assert:
    that:
      - image_tag is defined
      - image_tag | length > 0
      - image_tag != 'latest'
    fail_msg: "Fournir un tag immuable : -e image_tag=<sha>"

- name: Créer le dossier de l'application
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Copier docker-compose.yml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/docker-compose.yml"
    dest: "{{ app_dir }}/docker-compose.yml"
    mode: "0644"

- name: Copier la configuration Nginx
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/nginx.conf"
    dest: "{{ app_dir }}/nginx.conf"
    mode: "0644"

- name: Installer le script de déploiement
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/deploy.sh"
    dest: "{{ app_dir }}/deploy.sh"
    owner: root
    mode: "0755"

- name: Déployer la version demandée (rollback automatique en cas d'échec)
  ansible.builtin.command:
    cmd: "{{ app_dir }}/deploy.sh {{ image_tag }}"
  register: deploy
  changed_when: "'NOCHANGE' not in deploy.stdout"