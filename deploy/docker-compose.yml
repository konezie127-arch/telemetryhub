services:
  app:
    image: ghcr.io/konezie127-arch/telemetryhub:${IMAGE_TAG}
    volumes:
      - app_data:/data
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app_data:
